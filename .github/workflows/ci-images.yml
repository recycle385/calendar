name: Test and build images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    env:
      PORT: 4000
      NODE_ENV: test
      BACKEND_URL: http://localhost:4000
      CLIENT_URL: http://localhost:8080
      MAIN_JWT_SECRET: test_main_jwt_secret_key_1234
      PARTICIPANT_JWT_SECRET: test_participant_jwt_secret_key_1234
      REFRESH_JWT_SECRET: test_refresh_jwt_secret_key_1234
      LEGACY_JWT_SECRET: test_legacy_jwt_secret_key_1234
      SESSION_SECRET: test_session_secret
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: calendar_user
      DB_USER_PASSWORD: calti
      DB_NAME: calendar_db
      DB_CONNECTION_LIMIT: 10
      REDIS_URL: redis://127.0.0.1:6380
      GOOGLE_CLIENT_ID: dummy_client_id
      GOOGLE_CLIENT_SECRET: dummy_client_secret
      GET_REST_DE_INFO: dummy_api_key
      SIGNUP_MODE: immediate
      ENABLE_RATE_LIMIT: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Start test dependencies
        run: docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 120
      - run: npm ci
      - run: npm test
      - name: Show dependency logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color
      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes

  images:
    needs: [frontend-test, backend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./frontend
            build_args: VITE_ASSET_BASE_URL=https://pub-52f1db68b62c420aa3b098926983d749.r2.dev
          - name: backend
            context: ./back-end
            build_args: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/calendar-${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
