name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR에 생성된 전체 Git 커밋 SHA
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
            echo "전체 Git 커밋 SHA만 사용할 수 있습니다." >&2
            exit 1
          }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Check out deployment revision and deploy selected images
        env:
          DEPLOY_HOST: ${{ secrets.ORACLE_HOST }}
          DEPLOY_USER: ${{ secrets.ORACLE_USER }}
          DEPLOY_PATH: ${{ secrets.ORACLE_DEPLOY_PATH }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$IMAGE_TAG'" <<'REMOTE'
          set -Eeuo pipefail

          DEPLOY_PATH="$1"
          IMAGE_TAG="$2"

          cd "$DEPLOY_PATH"

          command -v flock >/dev/null 2>&1 || {
            echo "flock 명령을 찾을 수 없어 안전하게 배포를 잠글 수 없습니다." >&2
            exit 1
          }

          exec 9>/tmp/moim-production-deploy.lock
          flock -n 9 || {
            echo "다른 배포가 이미 진행 중입니다." >&2
            exit 1
          }
          export DEPLOY_LOCK_HELD=1

          git fetch --prune origin '+refs/heads/main:refs/remotes/origin/main'

          git cat-file -e "${IMAGE_TAG}^{commit}" 2>/dev/null || {
            echo "배포할 커밋을 서버 저장소에서 찾을 수 없습니다: $IMAGE_TAG" >&2
            exit 1
          }

          git merge-base --is-ancestor "$IMAGE_TAG" origin/main || {
            echo "main 이력에 포함된 커밋만 배포할 수 있습니다: $IMAGE_TAG" >&2
            exit 1
          }

          git switch --detach "$IMAGE_TAG"
          ./deploy/scripts/deploy.sh "$IMAGE_TAG"
          REMOTE
