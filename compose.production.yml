name: moim

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER}/calendar-frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      BACKEND_UPSTREAM: backend:3000
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    networks:
      - moim
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  backend:
    image: ghcr.io/${GHCR_OWNER}/calendar-backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-./deploy/.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=192
    expose:
      - '3000'
    volumes:
      - backend_logs:/usr/src/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    mem_limit: 256m
    networks:
      - moim
    logging: *default-logging

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    expose:
      - '3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./back-end/src/models/schema/calendar_db.sql:/docker-entrypoint-initdb.d/calendar_db.sql:ro
      - ./deploy/mysql/moim.cnf:/etc/mysql/conf.d/moim.cnf:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 384m
    networks:
      - moim
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    networks:
      - moim
    logging: *default-logging

  certbot:
    image: certbot/certbot:latest
    profiles: ['tools']
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    networks:
      - moim

networks:
  moim:
    driver: bridge

volumes:
  backend_logs:
  db_data:
  redis_data:
